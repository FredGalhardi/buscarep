<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuscaRep - Explorar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">BuscaRep - Itajubá</h1>
        
        <div class="space-y-4">
            {% for rep in republicas %}
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold">{{ rep.nome }}</h2>
                <p class="text-gray-500 text-sm mb-3">📍 Bairro {{ rep.bairro }}</p>
                
                <div class="flex justify-between items-center">
                    <span class="text-indigo-600 font-bold">R$ {{ rep.preco_minimo }}/mês</span>
                    {% if rep.vagas > 0 %}
                        <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full">{{ rep.vagas }} vagas</span>
                    {% else %}
                        <span class="bg-red-100 text-red-700 text-xs px-2 py-1 rounded-full">Sem vagas</span>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
